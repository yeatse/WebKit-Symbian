<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ScreenPlay rendering test</title>
<style>
html,body { margin:0; padding:0; background:#fff; color:#000; font:14px sans-serif; }
#heading { position:absolute; left:8px; top:8px; margin:0; font:16px/24px sans-serif; }
#scene { position:absolute; left:8px; top:40px; width:288px; height:360px; background:#fff; outline:2px solid #000; overflow:hidden; }
.patch { position:absolute; top:8px; width:48px; height:40px; }
#red { left:8px; background:#f00; } #green { left:72px; background:#0f0; }
#blue { left:136px; background:#00f; } #yellow { left:200px; background:#ff0; }
#alpha { position:absolute; left:8px; top:64px; width:48px; height:40px; background:rgba(255,0,0,.5); }
#clip { position:absolute; left:72px; top:64px; width:48px; height:40px; overflow:hidden; background:#fff; }
#clipped { position:absolute; left:24px; top:0; width:48px; height:40px; background:#f0f; }
#font { position:absolute; left:136px; top:64px; width:144px; height:40px; margin:0; overflow:hidden; font:16px/20px sans-serif; }
#moving { position:absolute; left:8px; top:128px; width:32px; height:32px; background:#008080; }
.animate { animation:slide 1000ms linear forwards; }
@keyframes slide { from { transform:translateX(0); } to { transform:translateX(128px); } }
#dirty { position:absolute; left:8px; top:184px; width:48px; height:32px; background:#000; }
#resize { position:absolute; left:88px; top:184px; width:48px; height:32px; background:#800080; }
#canvas2d { position:absolute; top:240px; width:48px; height:32px; background:#fff; }
#canvas2d { left:8px; }
#tap { position:absolute; left:8px; top:296px; width:224px; height:40px; box-sizing:border-box; border:2px solid #000; padding:0; background:#eee; color:#000; font:14px sans-serif; }
#status { position:absolute; left:8px; top:410px; width:288px; margin:0; font:12px/16px monospace; }
</style>
<h1 id="heading">ScreenPlay rendering test</h1>
<div id="scene">
  <div class="patch" id="red"></div><div class="patch" id="green"></div>
  <div class="patch" id="blue"></div><div class="patch" id="yellow"></div>
  <div id="alpha"></div><div id="clip"><div id="clipped"></div></div>
  <p id="font">Text Aa 0123<br>ordinary DOM</p>
  <div id="moving"></div><div id="dirty"></div><div id="resize"></div>
  <canvas id="canvas2d" width="48" height="32"></canvas>
  <button id="tap" type="button">Test button</button>
</div>
<pre id="status">RUNNING: screenplay-regression</pre>
<script>
(function () {
    'use strict';
    var names = ['opaque color patches', 'font layout', 'overflow clipping', 'alpha blending',
        'element hit testing', 'canvas 2D drawing', 'dirty region repaint',
        'animation final position', 'resized element geometry'];
    var results = {}, finished = false, dirtyCount = 0, resizeSaw80 = false;
    var status = document.getElementById('status');
    function log(message) { console.log(message); status.textContent += '\n' + message; }
    function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(watchdog);
        var passed = 0, failed = 0;
        names.forEach(function (name) {
            if (results[name]) ++passed;
            else { ++failed; if (!(name in results)) log('FAIL: ' + name); }
        });
        log('RESULT: screenplay-regression passed=' + passed + ' failed=' + failed);
        log((failed ? 'FAIL: ' : 'PASS: ') + 'screenplay-regression');
        document.title = (failed ? 'FAIL' : 'PASS') + ' ScreenPlay';
    }
    function check(name, condition) {
        if (finished || name in results) return;
        results[name] = !!condition;
        log((condition ? 'PASS: ' : 'FAIL: ') + name);
        if (Object.keys(results).length === names.length) finish();
    }
    function near(a, b) { return Math.abs(a - b) < 0.75; }
    function rect(id) { return document.getElementById(id).getBoundingClientRect(); }
    function inside(element, x, y) { return document.elementFromPoint(x, y) === element; }
    var watchdog = setTimeout(finish, 10000);
    try {
        var red = rect('red'), green = rect('green'), blue = rect('blue'), yellow = rect('yellow');
        check('opaque color patches', near(red.left,16) && near(red.top,48) && near(red.width,48) &&
            near(red.height,40) && near(green.left,80) && near(blue.left,144) && near(yellow.left,208));
        var font = rect('font'), fontStyle = getComputedStyle(document.getElementById('font'));
        check('font layout', near(font.width,144) && near(font.height,40) && fontStyle.fontSize === '16px');
        var clip = rect('clip'), clipped = document.getElementById('clipped');
        check('overflow clipping', inside(clipped,clip.left+36,clip.top+16) && !inside(clipped,clip.right+8,clip.top+16));
        check('alpha blending', getComputedStyle(document.getElementById('alpha')).backgroundColor === 'rgba(255, 0, 0, 0.5)');
        var tap = document.getElementById('tap'), tapRect = rect('tap');
        check('element hit testing', inside(tap,tapRect.left+112,tapRect.top+20));
        tap.onclick = function () { tap.textContent = 'Button clicked'; };
        var context = document.getElementById('canvas2d').getContext('2d');
        if (context) {
            context.fillStyle = '#008000'; context.fillRect(0,0,48,32);
            var pixel = context.getImageData(24,16,1,1).data;
            check('canvas 2D drawing', pixel[0] === 0 && pixel[1] === 128 && pixel[2] === 0 && pixel[3] === 255);
        } else check('canvas 2D drawing', false);
        var moving = document.getElementById('moving');
        moving.addEventListener('animationend', function (event) {
            if (event.target !== moving || event.animationName !== 'slide') return;
            var box = rect('moving');
            check('animation final position', near(box.left,144) && near(box.top,168));
        });
        moving.className = 'animate';
        ['#ff8000','#800080','#00ffff'].forEach(function (color,index) {
            setTimeout(function () { document.getElementById('dirty').style.backgroundColor = color; ++dirtyCount; },250*(index+1));
        });
        setTimeout(function () {
            document.getElementById('resize').style.width = '80px';
            resizeSaw80 = near(rect('resize').width,80);
        },500);
        setTimeout(function () { document.getElementById('resize').style.width = '64px'; },1100);
        setTimeout(function () {
            check('dirty region repaint', dirtyCount === 3 && getComputedStyle(document.getElementById('dirty')).backgroundColor === 'rgb(0, 255, 255)');
            var box = rect('resize');
            check('resized element geometry', resizeSaw80 && near(box.width,64) && near(box.height,32));
        },1800);
    } catch (error) { finish(); }
}());
</script>
</html>
