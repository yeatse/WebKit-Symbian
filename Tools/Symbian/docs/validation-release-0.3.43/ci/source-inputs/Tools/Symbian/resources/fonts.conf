<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- System fonts remain on ROM; additional fonts may be installed on C:. -->
  <dir>Z:/resource/fonts</dir>
  <dir>C:/resource/fonts</dir>
  <cachedir>C:/Data/fontconfig-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Nokia Pure Text</family><family>Nokia Sans S60</family><family>Series 60 Sans</family><family>Arial</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Times New Roman</family><family>Georgia</family><family>Nokia Pure Text</family><family>Nokia Sans S60</family><family>Series 60 Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Nokia Pure Text Mono</family><family>DejaVu Sans Mono</family><family>Courier New</family></prefer>
  </alias>
</fontconfig>
