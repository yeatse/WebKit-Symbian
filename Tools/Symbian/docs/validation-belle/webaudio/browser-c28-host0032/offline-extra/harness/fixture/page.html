<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico?run=%%TOKEN%%"><title>WebAudio independent offline vectors</title>
<style>body{font:17px sans-serif;margin:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h2>WebAudio offline extra</h2><pre id="status">Running three public API cases…</pre>
<script>
'use strict';
const run=%%RUN%%,rate=32768,q='?run='+encodeURIComponent(run),status=document.getElementById('status');let sequence=0,current='case-a';
function require(ok){if(!ok)throw Error('assertion');}
async function event(kind,data){const response=await fetch('/event'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({run,sequence:sequence++,kind,secure:isSecureContext},data))});if(!response.ok)throw Error('event');}
function rendered(out){return{sample_rate:out.sampleRate,channels:out.numberOfChannels,frames:out.length,samples:Array.from({length:out.numberOfChannels},(_,i)=>Array.from(out.getChannelData(i)))};}
function exact(out,expected){for(let ch=0;ch<out.numberOfChannels;ch++){const values=out.getChannelData(ch);for(let i=0;i<values.length;i++)require(values[i]===expected(ch,i));}}
function response(node,frequencies,phaseCount){const frequencyHz=new Float32Array(frequencies),magnitude=new Float32Array(frequencies.length),phase=new Float32Array(frequencies.length);node.getFrequencyResponse(frequencyHz,magnitude,phase);return{type:node.type,frequency:node.frequency.value,q:node.Q.value,detune:node.detune.value,frequencies:Array.from(frequencyHz),magnitude:Array.from(magnitude),phase:Array.from(phase.slice(0,phaseCount))};}
async function tests(){
 require(isSecureContext&&location.hostname==='localhost'&&typeof OfflineAudioContext==='function');
 {
  const c=new OfflineAudioContext(2,512,rate),b=c.createBuffer(2,512,rate);b.getChannelData(0)[0]=1;b.getChannelData(0)[1]=-.5;b.getChannelData(1)[3]=.25;
  const source=c.createBufferSource(),split=c.createChannelSplitter(2),merge=c.createChannelMerger(2),delay=c.createDelay(.1);source.buffer=b;delay.delayTime.value=1/256;
  source.connect(split);split.connect(delay,0,0);delay.connect(merge,0,0);split.connect(merge,1,1);merge.connect(c.destination);source.start();const out=await c.startRendering();await event('swapped-delay-channel',rendered(out));exact(out,(ch,i)=>ch===0?(i===128?1:i===129?-.5:0):(i===3?.25:0));
 }
 current='case-b';
 {
  const c=new OfflineAudioContext(1,512,rate),b=c.createBuffer(1,512,rate);b.getChannelData(0)[0]=1;b.getChannelData(0)[1]=-.5;
  const source=c.createBufferSource(),gain=c.createGain(),delay=c.createDelay(.1);source.buffer=b;gain.gain.value=1;delay.delayTime.value=1/256;source.connect(gain);gain.connect(delay);delay.connect(c.destination);source.start();const out=await c.startRendering();await event('mono-gain-delay',rendered(out));exact(out,(_,i)=>i===128?1:i===129?-.5:0);
 }
 current='case-c';
 {
  const c=new OfflineAudioContext(1,128,rate),lowpass=c.createBiquadFilter(),allpass=c.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=8192;lowpass.Q.value=-10*Math.log10(2);lowpass.detune.value=0;allpass.type='allpass';allpass.frequency.value=8192;allpass.Q.value=1;allpass.detune.value=0;
  const low=response(lowpass,[0,8192,16384],2),all=response(allpass,[0,4096,8192,12288,16384],5);await event('biquad-response',{sample_rate:c.sampleRate,lowpass:low,allpass:all});
  require(low.magnitude.every((x,i)=>Number.isFinite(x)&&Math.abs(x-[1,Math.SQRT1_2,0][i])<=1e-5));require(low.phase.every((x,i)=>Number.isFinite(x)&&Math.abs(x-[0,-Math.PI/2][i])<=1e-5));require(all.magnitude.every(x=>Number.isFinite(x)&&Math.abs(x-1)<=1e-5)&&all.phase.every(Number.isFinite));
 }
 status.textContent='OFFLINE_EXTRA_API_COMPLETE';console.log('WEBAUDIO-EXTRA-RESULT '+JSON.stringify({run,kind:'result',status:'OFFLINE_EXTRA_API_COMPLETE'}));
}
tests().catch(async()=>{status.textContent='FAIL '+current;try{await event('error',{code:current});}catch(e){}console.log('WEBAUDIO-EXTRA-RESULT '+JSON.stringify({run,kind:'result',status:'FAIL'}));});
</script>
