<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public secret FEP UI check</title>
<style>body{font:18px sans-serif;margin:12px}button,input{display:block;font:20px sans-serif;margin:18px 0;padding:12px;box-sizing:border-box;width:100%}pre{white-space:pre-wrap;font:14px monospace}</style>
<h2>Password FEP: public test data</h2><div id="kind"></div><button id="start">Start public mask check</button><input id="field" type="password" autocomplete="off" spellcheck="false"><button id="finish">Verify after native input</button><pre id="status">Loading</pre>
<script>
(function(){'use strict';var q=new URL(location.href).searchParams,run=q.get('run'),kind=q.get('case');
var field=document.getElementById('field'),status=document.getElementById('status'),armed=false,tapped=false,done=false,timer;
var original='public-mask-check',replacement='public-mask-edited';
function assert(b,s){if(!b)throw Error(s)}
function log(k,v){console.log('SECRET-FEP '+run+' '+kind+' '+k+' '+JSON.stringify(v||{}));status.textContent=k;}
function fail(e){if(done)return;done=true;clearTimeout(timer);log('FAIL',{error:String(e)});}
function guarded(f){return function(e){if(done)return;try{assert(e.isTrusted,'requires real trusted input');f(e)}catch(err){fail(err)}}}
document.getElementById('kind').textContent=kind;
document.getElementById('start').onclick=guarded(function(){assert(!armed,'Start once');armed=true;field.value=original;field.focus();field.setSelectionRange(1,4);log('ARMED',{utf16Length:field.value.length,selection:[field.selectionStart,field.selectionEnd]});timer=setTimeout(function(){fail('native sequence did not finish within120s')},120000);});
field.onclick=guarded(function(){assert(armed,'Start first');assert(!tapped,'one real field tap');tapped=true;field.setSelectionRange(1,4);log('FIELD-TAP',{utf16Length:field.value.length,selection:[field.selectionStart,field.selectionEnd]});});
document.getElementById('finish').onclick=guarded(function(){assert(armed&&tapped,'Start and actual password-field tap required');assert(field.type==='password','password type changed');
if(kind==='cancel'){assert(field.value===original,'Escape changed original value');assert(field.selectionStart===1&&field.selectionEnd===4,'Escape changed selection');}
else if(kind==='submit'){assert(field.value===replacement,'Submit did not replace exact public test text');assert(field.selectionStart===replacement.length&&field.selectionEnd===replacement.length,'Submit caret');}
else{assert(field.value==='','empty Submit did not clear');assert(field.selectionStart===0&&field.selectionEnd===0,'empty Submit caret');}
done=true;clearTimeout(timer);log('PAGE-PASS',{type:field.type,trustedTap:tapped,utf16Length:field.value.length,selection:[field.selectionStart,field.selectionEnd],maskReviewRequired:true});});
window.addEventListener('error',function(e){fail(e.message)});
window.addEventListener('load',function(){requestAnimationFrame(function(){requestAnimationFrame(function(){try{assert(/^[A-Za-z0-9_-]{1,64}$/.test(run||''),'run token');assert(['cancel','submit','empty'].indexOf(kind)>=0,'case');var rects={};['start','field','finish'].forEach(function(id){var r=document.getElementById(id).getBoundingClientRect();rects[id]={x:r.x+r.width/2,y:r.y+r.height/2,width:r.width,height:r.height}});log('READY',{run:run,case:kind,viewport:[innerWidth,innerHeight],rects:rects,publicDataOnly:true})}catch(err){fail(err)}})})})})();
</script>
