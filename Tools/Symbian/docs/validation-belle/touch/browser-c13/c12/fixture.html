<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belle native touch</title>
<style>
body{font:15px sans-serif;margin:10px;background:#fff;color:#182029}h1{font-size:19px;margin:8px 0}
#pad{height:190px;overflow:auto;border:3px solid #2563a5;background:#dcecff;margin:12px 0}
#content{height:800px;padding:12px;background:repeating-linear-gradient(#dcecff 0,#dcecff 39px,#a9c5e5 40px)}
#result{white-space:pre-wrap;font:13px monospace}a{margin-right:8px}.pass{color:#086b21}.fail{color:#b00020}
</style>
<h1>Native touch / pointer events</h1>
<p id="instruction"></p><div id="pad"><div id="content">Touch here. Drag upward within this blue panel.</div></div>
<pre id="result">WAITING — requires native input</pre>
<script>
(function () {
'use strict';
var query = new URLSearchParams(location.search), mode = query.get('case') || 'tap';
var run = query.get('run') || String(Date.now()), key = 'belle-touch-navigation-' + run;
var pad = document.getElementById('pad'), result = document.getElementById('result');
var counts = {}, records = [], done = false, timer, pointerIDs = {}, startID, maxTouches = 0;
var started = false, initialScroll = 0, maximumMovement = 0, startX, startY, primaryID;
var instructions = {
 tap: 'Tap once in the blue panel.',
 'prevent-start': 'Tap once: touchstart.preventDefault must suppress compatibility mouse/click.',
 'prevent-move': 'Drag upward at least 30 px: touchmove.preventDefault must prevent scrolling.',
 pan: 'Drag upward at least 30 px: native scrolling must cancel DOM touch/pointer streams.',
 'pointer-pan': 'Drag upward at least 30 px: pointerdown.preventDefault must still allow native scrolling.',
 none: 'Drag upward at least 30 px: touch-action:none keeps DOM events and prevents native scrolling.',
 capture: 'Press blue panel, drag outside its right edge, then release: pointer capture must retain delivery.',
 cancel: 'Hold a native contact; use an independent native focus-loss/cancel action before releasing.',
 navigation: 'Press and hold: this page navigates after 250 ms; old contacts must be cancelled.',
 multi: 'Use actual multiple native contacts, or explicitly documented WS injection; release both.',
 landing: 'Checking the preceding navigation cancellation.'
};
function log(text) { console.log('SYMBIAN TOUCH ' + mode + ' ' + text); }
function assert(value, text) { if (!value) throw new Error(text); }
function finish(ok, text) {
 if (done) return;
 done = true; clearTimeout(timer);
 result.className = ok ? 'pass' : 'fail';
 result.textContent = (ok ? 'PASS ' : 'FAIL ') + mode + '\n' + text + '\n' + JSON.stringify(counts);
 log('DONE ' + (ok ? 'PASS' : 'FAIL') + ' ' + text + ' ' + JSON.stringify(counts));
 log('EVENTS ' + JSON.stringify(records));
}
function guarded(fn) { return function (e) { if (done) return; try { fn(e); } catch (error) { finish(false, String(error)); } }; }
function count(type) { return counts[type] || 0; }
function check() {
 try {
  assert(started && count('touchstart') && count('pointerdown'), 'no actual touch/pointer start');
  assert(Number.isInteger(navigator.maxTouchPoints) && navigator.maxTouchPoints > 0, 'digitizer capacity missing');
  if (mode === 'pan' || mode === 'pointer-pan') {
   assert(count('touchcancel') === 1 && count('pointercancel') === 1, 'pan did not cancel both streams exactly once');
   assert(pad.scrollTop > initialScroll + 5, 'native pan did not move the overflow panel');
   assert(!count('click') && !count('mousedown') && !count('touchend'), 'pan synthesized an ending/click');
  } else if (mode === 'cancel') {
   assert(count('touchcancel') === 1 && count('pointercancel') === 1, 'native cancellation missing');
   assert(!count('click') && !count('touchend') && !count('pointerup'), 'cancelled contact ended or clicked');
  } else if (mode === 'multi') {
   assert(maxTouches >= 2 && count('touchstart') >= 2, 'simultaneous native contacts were not exercised');
   assert(Object.keys(pointerIDs).length >= 2, 'distinct pointer identifiers missing');
   assert(count('pointerup') >= 2 && count('touchend') >= 2, 'contacts did not finish');
   assert(!count('click') && !count('mousedown'), 'multi-contact sequence synthesized compatibility click');
   assert(count('pointermove') <= count('changed-touch-move'), 'stationary contacts generated extra pointermove');
  } else {
   assert(count('touchend') === 1 && count('pointerup') === 1, 'one-contact ending missing/duplicated');
   assert(count('touchstart') === 1 && count('pointerdown') === 1, 'compatibility pointer event duplicated');
   assert(!count('touchcancel') && !count('pointercancel'), 'unexpected cancellation');
   if (mode === 'tap') {
    assert(count('mousedown') === 1 && count('mouseup') === 1 && count('click') === 1, 'compatibility mouse/click must occur exactly once');
   } else {
    assert(!count('click') && !count('mousedown') && !count('mouseup'), 'suppressed/drag gesture synthesized mouse events');
    if (mode !== 'prevent-start') assert(count('touchmove') && maximumMovement >= 24, 'drag was not exercised');
    assert(pad.scrollTop === initialScroll, 'suppressed/native-disabled gesture scrolled');
    if (mode === 'capture') assert(count('gotpointercapture') === 1 && count('lostpointercapture') === 1 && counts['captured-outside'], 'capture outside target/release not exercised');
   }
  }
  finish(true, 'native sequence validated; maxTouchPoints=' + navigator.maxTouchPoints + ', peak contacts=' + maxTouches);
 } catch (error) { finish(false, String(error)); }
}
window.addEventListener('error', function (e) { finish(false, e.message); });
if (!instructions[mode]) { finish(false, 'unknown case'); return; }
document.getElementById('instruction').textContent = instructions[mode];
if (mode === 'landing') {
 try {
  var prior = JSON.parse(sessionStorage.getItem(key));
  assert(prior && prior.armed && prior.touchcancel === 1 && prior.pointercancel === 1, 'old page did not cancel touch+pointer before navigation');
  assert(!prior.touchend && !prior.pointerup && !prior.click, 'old page emitted terminal/click instead of cancellation');
  sessionStorage.removeItem(key); finish(true, 'old page native contact cancelled before navigation');
 } catch (error) { finish(false, String(error)); }
 return;
}
if (mode === 'none' || mode === 'capture' || mode === 'multi' || mode === 'navigation' || mode === 'cancel') pad.style.touchAction = 'none';
function rememberNavigation() {
 if (mode === 'navigation') sessionStorage.setItem(key, JSON.stringify({armed: started, touchcancel: count('touchcancel'), pointercancel: count('pointercancel'), touchend: count('touchend'), pointerup: count('pointerup'), click: count('click')}));
}
['touchstart','touchmove','touchend','touchcancel','pointerdown','pointermove','pointerup','pointercancel','gotpointercapture','lostpointercapture','mousedown','mouseup','click'].forEach(function (type) {
 pad.addEventListener(type, guarded(function (e) {
  assert(e.isTrusted, 'untrusted synthetic event cannot validate native input');
  counts[type] = count(type) + 1;
  var item = {type:type, target:e.target.id};
  if (type.indexOf('touch') === 0) {
   item.touches = Array.from(e.touches, function (t) { return t.identifier; });
   item.changed = Array.from(e.changedTouches, function (t) { return t.identifier; });
   maxTouches = Math.max(maxTouches, e.touches.length);
   assert(e.changedTouches.length > 0, 'empty changedTouches');
   assert(new Set(item.touches).size === item.touches.length, 'duplicate active contact');
   assert(e.touches.length <= navigator.maxTouchPoints, 'active contacts exceed capability');
   if (type === 'touchstart' && !started) {
    started = true; initialScroll = pad.scrollTop; startID = e.changedTouches[0].identifier;
    startX = e.changedTouches[0].clientX; startY = e.changedTouches[0].clientY;
    timer = setTimeout(function () { finish(false, 'native sequence did not complete within 20 seconds'); }, 20000);
    if (mode === 'navigation') {
     rememberNavigation(); setTimeout(function () { location.href = '?case=landing&run=' + encodeURIComponent(run); }, 250);
    }
   }
   for (var i = 0; i < e.changedTouches.length; ++i) {
    var t = e.changedTouches[i];
    assert(Number.isFinite(t.clientX) && Number.isFinite(t.screenX), 'invalid coordinates');
    if (mode !== 'multi') assert(t.identifier === startID, 'contact identity changed');
    maximumMovement = Math.max(maximumMovement, Math.abs(t.clientX-startX), Math.abs(t.clientY-startY));
   }
   if (type === 'touchmove') counts['changed-touch-move'] = count('changed-touch-move') + e.changedTouches.length;
   if ((mode === 'prevent-start' && type === 'touchstart') || (mode === 'prevent-move' && type === 'touchmove')) e.preventDefault();
   if (type === 'touchend') {
    assert(!item.touches.includes(e.changedTouches[0].identifier), 'released contact remains active');
    if (!e.touches.length && mode !== 'navigation') setTimeout(check, 250);
   }
   if (type === 'touchcancel') {
    assert(!e.touches.length && !e.targetTouches.length, 'cancel retains active contacts');
    if (mode !== 'navigation') setTimeout(check, 250);
   }
  } else if (type.indexOf('pointer') === 0 || type.indexOf('pointercapture') >= 0) {
   item.pointerId=e.pointerId; item.primary=e.isPrimary; item.pointerType=e.pointerType;
   assert(e.pointerType === 'touch', 'native contact became mouse pointer');
   assert(e.pressure >= 0 && e.pressure <= 1, 'invalid contact pressure');
   if (type === 'pointerdown') {
    pointerIDs[e.pointerId] = true;
    if (primaryID === undefined) { assert(e.isPrimary, 'first contact not primary'); primaryID=e.pointerId; }
    else assert(!e.isPrimary, 'second contact incorrectly primary');
    if (mode === 'pointer-pan') e.preventDefault();
    if (mode === 'capture') pad.setPointerCapture(e.pointerId);
   }
   if (mode !== 'multi') assert(e.pointerId === primaryID, 'pointer identity changed');
   if (mode === 'capture' && type === 'pointermove') {
    var rect=pad.getBoundingClientRect();
    if (e.clientX > rect.right || e.clientX < rect.left) counts['captured-outside']=true;
   }
  }
  records.push(item); rememberNavigation();
 }), {passive:false});
});
// The embedding applies meta-viewport scale on its next run-loop turn. Report
// coordinates after load and painting opportunities, not during initial parsing.
window.addEventListener('load', function () {
 requestAnimationFrame(function () { requestAnimationFrame(function () {
  var rect = pad.getBoundingClientRect();
  log('READY ' + JSON.stringify({run:run,maxTouchPoints:navigator.maxTouchPoints,instruction:instructions[mode],
   viewport:{width:innerWidth,height:innerHeight},pad:{left:rect.left,top:rect.top,width:rect.width,height:rect.height}}));
 }); });
});
}());
</script>
