<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Native FEP UI contract</title>
<style>body{font:18px sans-serif;margin:12px}button,input{display:block;font:20px sans-serif;margin:18px 0;padding:12px;box-sizing:border-box;width:100%}pre{white-space:pre-wrap;font:14px monospace}</style>
<h2>Native FEP UI</h2><div id="kind"></div><button id="start">Start</button><input id="field"><button id="finish">Verify after native input</button><pre id="status">Loading</pre>
<script>
(function(){'use strict';var q=new URL(location.href).searchParams,run=q.get('run'),kind=q.get('case');
var field=document.getElementById('field'),status=document.getElementById('status'),armed=false,tapped=false,old='A你好😀|Z';
function assert(b,s){if(!b)throw Error(s)}
function log(k,v){console.log('FEP-UI '+run+' '+kind+' '+k+' '+JSON.stringify(v||{}));status.textContent=k}
function guarded(f){return function(e){try{assert(e.isTrusted,'requires actual trusted input');f(e)}catch(err){log('FAIL',{error:String(err)})}}}
document.getElementById('kind').textContent=kind;
document.getElementById('start').onclick=guarded(function(){assert(!armed,'Start once');armed=true;field.readOnly=kind==='readonly';field.value=old;field.focus();field.setSelectionRange(1,4);log('ARMED',{selection:[field.selectionStart,field.selectionEnd]});});
field.onclick=guarded(function(){assert(armed,'Start first');tapped=true;if(kind!=='readonly')field.setSelectionRange(1,4);log('FIELD-TAP',{selection:[field.selectionStart,field.selectionEnd]});});
document.getElementById('finish').onclick=guarded(function(){assert(armed,'Start first');assert(kind==='programmatic'||tapped,'requires real field tap');
if(kind==='submit'){assert(field.value==='native text','accepted replacement text');assert(field.selectionStart===11&&field.selectionEnd===11,'accepted replacement caret')}
else if(kind==='empty'){assert(field.value==='','accepted empty replacement');assert(field.selectionStart===0&&field.selectionEnd===0,'empty replacement caret')}
else{assert(field.value===old,'field text changed on cancel/non-editor action');if(kind!=='readonly')assert(field.selectionStart===1&&field.selectionEnd===4,'field selection changed on cancel/non-editor action')}
log('PAGE-PASS',{trustedTap:tapped,utf16Length:field.value.length,selection:[field.selectionStart,field.selectionEnd],nativeUIReviewRequired:true});});
window.addEventListener('load',function(){requestAnimationFrame(function(){requestAnimationFrame(function(){try{assert(/^[A-Za-z0-9_-]{1,64}$/.test(run||''),'run token');assert(['programmatic','cancel','submit','empty','readonly'].indexOf(kind)>=0,'case');var rects={};['start','field','finish'].forEach(function(id){var r=document.getElementById(id).getBoundingClientRect();rects[id]={x:r.x+r.width/2,y:r.y+r.height/2,width:r.width,height:r.height}});log('READY',{viewport:[innerWidth,innerHeight],rects:rects})}catch(err){log('FAIL',{error:String(err)})}})})})})();
</script>
