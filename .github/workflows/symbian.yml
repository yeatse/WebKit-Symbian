# Build WebKit Browser, JavaScriptCore and ICU for Symbian^3, Anna and Belle.
# Source pushes to *-symbian branches upload symbian-webkit.sis in the sis artifact.
# A symbian-vX.Y.Z tag publishes version X.Y.Z; branch builds use 0.3.<run number>.
# SIS_CERTIFICATE and SIS_KEY repository secrets supply the PEM signing identity.
name: Symbian
run-name: 'Symbian 2.54.2 ARM11 JIT (${{ github.ref_name }}) #${{ github.run_number }}'

on:
  push:
    branches: ['*-symbian']
    tags: ['symbian-v*']
    paths-ignore:
      - '**.md'
      - '**/ChangeLog*'
      - 'Tools/Symbian/docs/**'
      - 'Tools/Symbian/eka2l1/**'
      - 'Tools/Symbian/qemu/**'
  pull_request:
    branches: ['*-symbian']
  workflow_dispatch:

concurrency:
  group: symbian-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: 0.3.0
  SYMBIAN_JSC_MODE: dfg
  SYMBIAN_WEBKIT_WORK: ${{ github.workspace }}/WebKitBuild/Symbian
  SYMBIAN_SDK_PREFIX: ${{ github.workspace }}/WebKitBuild/Symbian/symbian-sdk
  CCACHE_DIR: ${{ github.workspace }}/WebKitBuild/Symbian/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  # The SDK is unpacked afresh each run: hash compilers, not their mtimes.
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_MAXSIZE: 3G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Tools/Symbian
    steps:
      # Only the parts of WebKit the Symbian build reads; the whole tree with
      # LayoutTests is several gigabytes.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            PerformanceTests
            Source/JavaScriptCore
            Source/ThirdParty/ANGLE
            Source/ThirdParty/skia
            Source/ThirdParty/unifdef
            Source/WTF
            Source/WebCore
            Source/WebKitLegacy
            Source/bmalloc
            Source/cmake
            Tools/Scripts
            Tools/Symbian

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends clang lld cmake ninja-build ruby perl binutils \
            libjson-pp-perl gperf flex bison unifdef python3 python3-cryptography pkg-config ccache openssl \
            autoconf automake libtool g++ patch

      - name: SIS packaging
        run: python3 tests/sis-package/run.py

      - name: Symbian memory allocation regression
        run: |
          tests/native-memory/run.sh
          python3 tests/native-memory/run-aligned-pool.py

      - name: Belle storage, native UI and callback regressions
        run: |
          tests/native-filesystem/run.sh
          tests/browser-settings/run.sh
          tests/idb-quota/run-ledger.sh
          python3 tests/idb-quota/run-producer.py --work "$RUNNER_TEMP/idb-producer"
          python3 tests/idb-quota/test-contract.py
          python3 tests/idb-quota/test-server.py
          python3 tests/cookie-samesite/test-host.py
          python3 tests/cookie-samesite/test-runner.py
          python3 tests/belle-storage/test-contract.py
          python3 tests/belle-ui/app-exit/test-validator.py
          python3 tests/test-native-probe-runner.py
          python3 tests/runloop-wakeup/run.py --output "$RUNNER_TEMP/runloop-wakeup"

      - name: symbian-platform SDK
        uses: actions/cache/restore@v4
        id: sdk
        with:
          path: WebKitBuild/Symbian/symbian-sdk
          key: symbian-sdk-${{ env.SDK_VERSION }}-linux-x86_64
      - name: Download the SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$SDK_VERSION" --repo hpnkv/symbian-platform \
            --pattern "symbian-sdk-$SDK_VERSION-linux-x86_64.tar.gz" --dir "$RUNNER_TEMP"
          mkdir -p "$SYMBIAN_SDK_PREFIX"
          tar -xzf "$RUNNER_TEMP/symbian-sdk-$SDK_VERSION-linux-x86_64.tar.gz" -C "$SYMBIAN_SDK_PREFIX"
          rm "$RUNNER_TEMP"/symbian-sdk-*.tar.gz

      # Save the release before applying local headers/runtime patches.
      - name: Save the original SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/symbian-sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      # Run on cache hits too: the SDK release omits these official S^3 headers.
      - name: Restore Symbian^3 SDK media headers
        run: python3 scripts/apply-sdk-patches.py

      # Inputs that change rarely: the E32 converter with its host
      # dependencies, ICU and the WebCore libraries, each keyed on the scripts
      # and patches that build it, and the compiler cache. Each is saved as
      # soon as its step has run, so a later failure keeps it.
      - name: Restore the E32 converter
        uses: actions/cache/restore@v4
        id: converter
        with:
          path: |
            WebKitBuild/Symbian/symbian-platform
            WebKitBuild/Symbian/symbian-native
            WebKitBuild/Symbian/src/nlohmann-json
          key: symbian-native-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/build-symbian-native.sh', 'Tools/Symbian/scripts/apply-native-patches.py', 'Tools/Symbian/patches/symbian-native/**') }}
      - name: Restore ICU
        uses: actions/cache/restore@v4
        id: icu
        with:
          path: WebKitBuild/Symbian/icu
          key: icu-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/build-icu.sh', 'Tools/Symbian/scripts/icu-filter.py', 'Tools/Symbian/patches/icu-70.1/**', 'Tools/Symbian/scripts/common.sh', 'Tools/Symbian/toolchain/**') }}
      - name: Restore the WebCore libraries
        uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            WebKitBuild/Symbian/deps/install
            WebKitBuild/Symbian/deps/src/sqlite-amalgamation-3350500
            WebKitBuild/Symbian/deps/src/curl-7.88.1
          key: deps-belle-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/build-deps.sh', 'Tools/Symbian/scripts/rebuild-sdk-math.py', 'Tools/Symbian/patches/sdk-0.3.0/math/manifest.json', 'Tools/Symbian/patches/symbian-native/0007-Provide-C99-atan2l-in-the-real-guest-runtime.patch', 'Tools/Symbian/scripts/rebuild-sdk-complex.py', 'Tools/Symbian/patches/sdk-0.3.0/complex/manifest.json', 'Tools/Symbian/patches/symbian-native/0009-Build-complete-LLVM-double-complex-runtime.patch', 'Tools/Symbian/scripts/patch-curl-network.py', 'Tools/Symbian/scripts/patch-fontconfig-paths.py', 'Tools/Symbian/cmake/woff2/**', 'Tools/Symbian/shims/**', 'Tools/Symbian/scripts/common.sh', 'Tools/Symbian/toolchain/**', 'Tools/Symbian/tests/idb-quota/run-blob.sh', 'Tools/Symbian/tests/curl-address-family/run-host.sh') }}
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: WebKitBuild/Symbian/ccache
          key: ccache-symbian-2.54.2-${{ env.SDK_VERSION }}-${{ github.sha }}
          restore-keys: ccache-symbian-2.54.2-${{ env.SDK_VERSION }}-

      - name: E32 converter
        run: |
          scripts/build-symbian-native.sh
          python3 tests/sdk-native-patch-stack/test_patch_stack.py \
            --upstream "$SYMBIAN_WEBKIT_WORK/symbian-platform" \
            --output "$SYMBIAN_WEBKIT_WORK/native-patch-stack-regression" -v
      - name: Save the E32 converter
        if: steps.converter.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            WebKitBuild/Symbian/symbian-platform
            WebKitBuild/Symbian/symbian-native
            WebKitBuild/Symbian/src/nlohmann-json
          key: ${{ steps.converter.outputs.cache-primary-key }}

      - name: Restore the SDK runtime sources
        uses: actions/cache/restore@v4
        id: runtime
        with:
          path: WebKitBuild/Symbian/sdk-runtime
          key: sdk-runtime-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/rebuild-sdk-runtime.py', 'Tools/Symbian/patches/sdk-0.3.0/mimalloc-runtime.json', 'Tools/Symbian/patches/sdk-0.3.0/0001-mimalloc-32bit-pagemap.patch') }}
      - name: Rebuild and verify the 32-bit SDK allocator
        run: |
          python3 scripts/rebuild-sdk-runtime.py \
            --platform-source "$SYMBIAN_WEBKIT_WORK/symbian-platform" --install
          python3 tests/sdk-runtime/test-runtime-rebuild.py \
            --work "$SYMBIAN_WEBKIT_WORK/sdk-runtime"
      - name: Save the SDK runtime sources
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/sdk-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}

      # Always rebuild/verify after the allocator; cache only the external work,
      # never an already modified SDK prefix. Repeat the helper on cache hits.
      - name: Restore the SDK math work
        uses: actions/cache/restore@v4
        id: sdk_math
        with:
          path: WebKitBuild/Symbian/sdk-math
          key: sdk-math-armv6-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/rebuild-sdk-math.py', 'Tools/Symbian/patches/sdk-0.3.0/math/manifest.json', 'Tools/Symbian/patches/symbian-native/0007-Provide-C99-atan2l-in-the-real-guest-runtime.patch') }}
      - name: Rebuild and verify the SDK math member
        run: |
          python3 scripts/rebuild-sdk-math.py \
            --sdk "$SYMBIAN_SDK_PREFIX" \
            --source "$SYMBIAN_WEBKIT_WORK/symbian-platform" \
            --output "$SYMBIAN_WEBKIT_WORK/sdk-math" --install
      - name: Save the SDK math work
        if: steps.sdk_math.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/sdk-math
          key: ${{ steps.sdk_math.outputs.cache-primary-key }}

      # Original SDK cache is restored first; always rebuild after allocator/math.
      # Only external source/build work is cached, never a modified SDK prefix.
      - name: Restore the SDK complex work
        uses: actions/cache/restore@v4
        id: sdk_complex
        with:
          path: WebKitBuild/Symbian/sdk-complex
          key: sdk-complex-armv6-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/rebuild-sdk-complex.py', 'Tools/Symbian/patches/sdk-0.3.0/complex/manifest.json', 'Tools/Symbian/patches/symbian-native/0009-Build-complete-LLVM-double-complex-runtime.patch') }}
      - name: Rebuild and verify the SDK complex members
        run: |
          python3 scripts/rebuild-sdk-complex.py \
            --sdk "$SYMBIAN_SDK_PREFIX" \
            --source "$SYMBIAN_WEBKIT_WORK/symbian-platform" \
            --output "$SYMBIAN_WEBKIT_WORK/sdk-complex" --install
      - name: Save the SDK complex work
        if: steps.sdk_complex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/sdk-complex
          key: ${{ steps.sdk_complex.outputs.cache-primary-key }}

      - name: Restore the SDK resource compiler sources
        uses: actions/cache/restore@v4
        id: rcomp
        with:
          path: WebKitBuild/Symbian/sdk-rcomp
          key: sdk-rcomp-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/rebuild-sdk-rcomp.py', 'Tools/Symbian/patches/sdk-0.3.0/rcomp/**', 'Tools/Symbian/tests/rcomp/**') }}
      # Rebuild and rerun the identifier regressions on cache hits too.
      - name: Repair and verify the SDK resource compiler
        run: |
          python3 tests/rcomp/test-rebuild-sdk-rcomp.py
          python3 scripts/rebuild-sdk-rcomp.py --install
      - name: Save the SDK resource compiler sources
        if: steps.rcomp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/sdk-rcomp
          key: ${{ steps.rcomp.outputs.cache-primary-key }}

      - name: Restore the SDK IP certificate repair sources
        uses: actions/cache/restore@v4
        id: mbedtls-ip
        with:
          path: WebKitBuild/Symbian/sdk-mbedtls-ip
          key: sdk-mbedtls-ip-${{ env.SDK_VERSION }}-${{ hashFiles('Tools/Symbian/scripts/rebuild-sdk-mbedtls-ip.py', 'Tools/Symbian/patches/sdk-0.3.0/mbedtls-ip/**', 'Tools/Symbian/tests/tls-ip-san/**') }}
      # Recompile both ARM objects and rerun signed-certificate/ClientHello
      # regressions even when the source and original-archive cache is restored.
      - name: Repair and verify SDK IP certificate identities
        run: |
          python3 scripts/rebuild-sdk-mbedtls-ip.py --install
          python3 tests/tls-ip-san/test-rebuild-wrapper.py \
            --sdk "$SYMBIAN_SDK_PREFIX" \
            --work-dir "$SYMBIAN_WEBKIT_WORK/sdk-mbedtls-ip" \
            --output "$SYMBIAN_WEBKIT_WORK/sdk-mbedtls-ip/wrapper-rejections.json"
      - name: Save the SDK IP certificate repair sources
        if: steps.mbedtls-ip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/sdk-mbedtls-ip
          key: ${{ steps.mbedtls-ip.outputs.cache-primary-key }}

      - name: ICU
        run: scripts/build-icu.sh
      - name: ICU domain-name data regression
        run: |
          python3 tests/icu-idna/run.py \
            --icu-root "$SYMBIAN_WEBKIT_WORK/icu" \
            --existing-data "$SYMBIAN_WEBKIT_WORK/icu/install/share/icu/icudt70l.dat" \
            --output "$SYMBIAN_WEBKIT_WORK/icu-idna-regression.json"
      - name: Save ICU
        if: steps.icu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/icu
          key: ${{ steps.icu.outputs.cache-primary-key }}

      - name: JavaScriptCore
        run: scripts/build-jsc.sh
      - name: jsc.exe
        run: scripts/link-e32.sh
      - name: WebCore libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh
      - name: Save the WebCore libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            WebKitBuild/Symbian/deps/install
            WebKitBuild/Symbian/deps/src/sqlite-amalgamation-3350500
            WebKitBuild/Symbian/deps/src/curl-7.88.1
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Real SQLite Blob commits and curl address-family regression
        run: |
          TEST_WORK="$RUNNER_TEMP/idb-blob" tests/idb-quota/run-blob.sh
          tests/curl-address-family/run-host.sh "$SYMBIAN_WEBKIT_WORK/deps/src/curl-7.88.1"
      - name: WebCore
        run: scripts/build-webcore.sh
      - name: ScreenPlay buffer lifecycle regression
        run: |
          python3 tests/screenplay/run.py
          python3 tests/screenplay-update/run.py
      - name: browser.exe
        run: scripts/build-browser.sh
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: WebKitBuild/Symbian/ccache
          key: ccache-symbian-2.54.2-${{ env.SDK_VERSION }}-${{ github.sha }}
      - name: SIS package
        env:
          SIS_CERTIFICATE_PEM: ${{ secrets.SIS_CERTIFICATE }}
          SIS_KEY_PEM: ${{ secrets.SIS_KEY }}
        run: |
          if [ -n "$SIS_CERTIFICATE_PEM" ] && [ -n "$SIS_KEY_PEM" ]; then
            printf '%s\n' "$SIS_CERTIFICATE_PEM" > "$RUNNER_TEMP/sis.pem"
            printf '%s\n' "$SIS_KEY_PEM" > "$RUNNER_TEMP/sis.key"
            export SIS_CERTIFICATE=$RUNNER_TEMP/sis.pem SIS_KEY=$RUNNER_TEMP/sis.key
          fi
          export SIS_VERSION=0.3.$GITHUB_RUN_NUMBER
          if [[ $GITHUB_REF == refs/tags/symbian-v* ]]; then export SIS_VERSION=${GITHUB_REF_NAME#symbian-v}; fi
          scripts/package-sis.sh
          printf 'SIS_VERSION=%s\n' "$SIS_VERSION" >> "$GITHUB_ENV"
          (
            cd "$SYMBIAN_WEBKIT_WORK/sis"
            test -s symbian-webkit.sis
            sha256sum symbian-webkit.sis > SHA256SUMS
          )
          rm -f "$RUNNER_TEMP/sis.key"
          ccache -s

      - name: Upload SIS package
        id: sis
        uses: actions/upload-artifact@v4
        with:
          name: sis
          path: |
            WebKitBuild/Symbian/sis/symbian-webkit.sis
            WebKitBuild/Symbian/sis/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      # Publish the JavaScript shell as the jsc artifact.
      - name: Upload jsc.exe
        id: jsc
        uses: actions/upload-artifact@v4
        with:
          name: jsc
          path: WebKitBuild/Symbian/build/e32/e32/jsc.exe
          if-no-files-found: error
      # Keep an ELF even when E32 conversion or packaging fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elf
          path: WebKitBuild/Symbian/build/browser/browser.elf
          retention-days: 30
          if-no-files-found: warn
      - name: Package download summary
        env:
          SIS_ARTIFACT_URL: ${{ steps.sis.outputs.artifact-url }}
          JSC_ARTIFACT_URL: ${{ steps.jsc.outputs.artifact-url }}
        run: |
          {
            printf '### WebKit 2.54.2 for Symbian\n\n'
            printf '[Download symbian-webkit.sis](%s) · Version `%s`\n\n' "$SIS_ARTIFACT_URL" "$SIS_VERSION"
            printf 'Branch: `%s` · Commit: `%s`\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            printf 'JavaScript: ARM LLInt + Baseline JIT + DFG (ARMv6, VFPv2, softfp).\n\n'
            printf 'Install `symbian-webkit.sis` and launch WebKit Browser from the applications menu.\n\n'
            printf '[Download the JavaScript shell (jsc.exe)](%s)\n\n' "$JSC_ARTIFACT_URL"
            printf '```text\n'
            cat "$SYMBIAN_WEBKIT_WORK/sis/SHA256SUMS"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            WebKitBuild/Symbian/*.log
            WebKitBuild/Symbian/icu/*.log
            WebKitBuild/Symbian/deps/*.log
            WebKitBuild/Symbian/deps/src/**/config.log
            WebKitBuild/Symbian/native-patch-stack-regression/*.json
            WebKitBuild/Symbian/sdk-runtime/*.json
            WebKitBuild/Symbian/sdk-runtime/*.log
            WebKitBuild/Symbian/sdk-math/*.json
            WebKitBuild/Symbian/sdk-math/*.log
            WebKitBuild/Symbian/sdk-complex/*.json
            WebKitBuild/Symbian/sdk-complex/*.log
            WebKitBuild/Symbian/sdk-rcomp/*.json
            WebKitBuild/Symbian/sdk-rcomp/*.log
            WebKitBuild/Symbian/sdk-mbedtls-ip/*.json
            WebKitBuild/Symbian/sdk-mbedtls-ip/*.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/symbian-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$SYMBIAN_WEBKIT_WORK/sis/symbian-webkit.sis" \
            "$SYMBIAN_WEBKIT_WORK/build/e32/e32/jsc.exe" --clobber
